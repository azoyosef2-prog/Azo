name: Build ADMAKER AI APK

on:
  push:
    paths:
      - 'admaker-apk/**'
      - '.github/workflows/build-admaker-apk.yml'
  pull_request:
    paths:
      - 'admaker-apk/**'
      - '.github/workflows/build-admaker-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        working-directory: admaker-apk
        run: gradle assembleDebug --stacktrace

      - name: Rename APK
        run: cp admaker-apk/app/build/outputs/apk/debug/app-debug.apk ADMAKER_AI.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ADMAKER_AI_APK
          path: ADMAKER_AI.apk
          retention-days: 30
